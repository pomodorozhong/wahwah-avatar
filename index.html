<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wahwah Avatar · Model playground</title>
    <style>
      :root { color-scheme: dark; --bg:#14171f; --panel:#1d2230; --line:#33394a; --ink:#eef0f6; --dim:#9aa3b8; --accent:#f7ce4f; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,sans-serif; }
      header { padding:16px; display:grid; gap:10px; border-bottom:1px solid var(--line); }
      h1 { margin:0; font-size:18px; }
      .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
      input[type=text] { flex:1 1 260px; min-width:0; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; }
      button, select { padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; cursor:pointer; }
      button.primary { background:var(--accent); color:#1a1a1a; border-color:var(--accent); font-weight:600; }
      button:disabled { opacity:.5; cursor:default; }
      #note { color:var(--dim); margin:0; font-size:13px; }
      #grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; padding:16px; }
      .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:grid; grid-template-rows:auto 1fr; }
      .panel .head { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 10px; font-size:13px; color:var(--dim); }
      .panel .stageview { position:relative; aspect-ratio:1; }
      .panel canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
      .panel .status { position:absolute; left:8px; bottom:8px; font-size:12px; color:var(--dim); pointer-events:none; }
    </style>
  </head>
  <body>
    <header>
      <h1>Model playground</h1>
      <div class="bar">
        <input id="text" type="text" value="Hello there, this is a test of the mumble voice." aria-label="Text to speak" />
        <button id="speak" class="primary" disabled>Speak</button>
        <button id="stop">Stop</button>
      </div>
      <div class="bar">
        <button id="addTofu">Add Tofu</button>
        <button id="addFile">Add .vrm file…</button>
        <input id="file" type="file" accept=".vrm" hidden />
      </div>
      <p id="note">Every model is driven by the same rendered utterance at the same time. Files you open stay in your browser.</p>
    </header>
    <main id="grid"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
