<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Wahwah Avatar · Model playground</title>
    <style>
      :root { color-scheme: dark; --bg:#14171f; --panel:#1d2230; --line:#33394a; --ink:#eef0f6; --dim:#9aa3b8; --accent:#f7ce4f; }
      * { box-sizing: border-box; }
      html, body { height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }
      body { margin:0; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,sans-serif; }
      header { flex:none; display:flex; flex-wrap:nowrap; gap:8px; align-items:center; padding:8px; border-bottom:1px solid var(--line); }
      header > * { flex:none; }
      .sep { width:1px; align-self:stretch; background:var(--line); }
      input[type=text] { flex:1 1 200px; min-width:120px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; }
      button { padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; cursor:pointer; white-space:nowrap; }
      button.primary { background:var(--accent); color:#1a1a1a; border-color:var(--accent); font-weight:600; }
      button:disabled { opacity:.5; cursor:default; }
      #grid { flex:1 1 0; min-height:0; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr); gap:8px; padding:8px; }
      .panel { position:relative; min-width:0; min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
      .panel canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
      .panel .chips { position:absolute; left:4px; top:4px; right:4px; z-index:1; display:flex; flex-wrap:wrap; gap:4px; pointer-events:none; }
      .panel .chips button { pointer-events:auto; max-width:100%; overflow:hidden; text-overflow:ellipsis; border-radius:14px; background:#14171fcc; border:1px solid #3c4458; padding:4px 10px; font-size:12px; }
      .panel .chips button:hover { border-color:#5b6785; }
      .panel .chips button.chip { padding:3px 9px; font-size:11px; color:#c6cde0; }
      .panel .hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:13px; pointer-events:none; }
      .panel .status { position:absolute; left:8px; bottom:8px; font-size:12px; color:var(--dim); pointer-events:none; }
      [hidden] { display:none !important; }
      .menu { position:fixed; z-index:20; min-width:200px; max-width:min(320px, calc(100vw - 16px)); max-height:calc(100vh - 16px); overflow:auto; background:#262d40; border:1px solid #3c4458; border-radius:10px; padding:6px; box-shadow:0 8px 24px #000a; font-size:13px; }
      .menu .item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; }
      .menu .item:hover { background:#ffffff14; }
      .menu .item.selected { background:#2f6fe033; }
      .menu .item.accent { color:#6aa6ff; }
      .menu .label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .menu .check { width:1em; text-align:center; }
      .menu .remove { padding:0 4px; border:0; background:none; color:var(--dim); font-size:12px; }
      .menu .remove:hover { color:#ff8a8a; }
      .menu .heading { padding:4px 8px 2px; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:#7c869d; }
      .menu .divider { border:0; border-top:1px solid #3c4458; margin:6px 0; }
      .menu .sq { display:grid; grid-template-columns:repeat(4,18px); gap:4px; padding:4px 8px 6px; }
      .menu .sq i { width:18px; height:18px; border-radius:4px; background:#2d3550; border:1px solid #3c4458; cursor:pointer; }
      .menu .sq i.on { background:#2f6fe0; border-color:#2f6fe0; }
    </style>
  </head>
  <body>
    <header>
      <input id="text" type="text" value="Hello there, this is a test of the mumble voice." aria-label="Text to speak" />
      <button id="speak" class="primary" disabled>Speak</button>
      <button id="stop">Stop</button>
      <span class="sep"></span>
      <button id="layoutBtn" aria-haspopup="menu" aria-expanded="false">Default · 2 × 1 ▾</button>
      <input id="file" type="file" accept=".vrm" hidden />
    </header>
    <main id="grid"></main>
    <script type="module" src="/src/playground/main.ts"></script>
  </body>
</html>
