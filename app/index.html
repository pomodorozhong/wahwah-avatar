<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Wahwah Avatar · Model playground</title>
    <style>
      :root { color-scheme: dark; --bg:#14171f; --panel:#1d2230; --line:#33394a; --ink:#eef0f6; --dim:#9aa3b8; --accent:#f7ce4f; }
      * { box-sizing: border-box; }
      html, body { height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }
      body { margin:0; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,sans-serif; }
      header { flex:none; display:flex; flex-wrap:nowrap; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); overflow-x:auto; }
      header > * { flex:none; }
      h1 { margin:0; font-size:16px; white-space:nowrap; }
      label { white-space:nowrap; color:var(--dim); font-size:13px; }
      .sep { width:1px; align-self:stretch; background:var(--line); }
      input[type=text] { flex:1 1 200px; min-width:120px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; }
      button, select { padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; cursor:pointer; white-space:nowrap; }
      button.primary { background:var(--accent); color:#1a1a1a; border-color:var(--accent); font-weight:600; }
      button:disabled { opacity:.5; cursor:default; }
      input[type=number] { width:3.5em; padding:5px 6px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; }
      #layoutPop { position:fixed; z-index:10; padding:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 28px #0008; display:grid; gap:10px; }
      #layoutPop[hidden] { display:none; }
      .pophead { display:flex; justify-content:space-between; gap:16px; align-items:baseline; font-size:12px; color:var(--dim); }
      .pophead strong { color:#6aa6ff; font-size:15px; }
      #picker { display:grid; gap:4px; }
      #picker i { width:28px; height:28px; border-radius:5px; border:1px solid var(--line); background:#232a3d; cursor:pointer; }
      #picker i.on { background:#2f6fe0; border-color:#2f6fe0; }
      .popfoot { display:flex; gap:8px; align-items:center; color:var(--dim); border-top:1px solid var(--line); padding-top:10px; }
      .popfoot .hint { font-size:12px; }
      #grid { flex:1 1 0; min-height:0; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr); gap:8px; padding:8px; }
      .panel { min-width:0; min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:grid; grid-template-rows:auto minmax(0,1fr); }
      .panel .head { display:flex; gap:6px; align-items:center; padding:4px 8px; font-size:13px; color:var(--dim); }
      .panel .head select { padding:2px 6px; font-size:12px; min-width:0; flex:1 1 0; }
      .panel .stageview { position:relative; min-height:0; }
      .panel canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
      .panel .status { position:absolute; left:8px; bottom:8px; font-size:12px; color:var(--dim); pointer-events:none; }
    </style>
  </head>
  <body>
    <header>
      <h1>Model playground</h1>
      <input id="text" type="text" value="Hello there, this is a test of the mumble voice." aria-label="Text to speak" />
      <button id="speak" class="primary" disabled>Speak</button>
      <button id="stop">Stop</button>
      <span class="sep"></span>
      <button id="layoutBtn" aria-haspopup="true" aria-expanded="false">Layout <span id="layoutSize">2 × 1</span> ▾</button>
      <button id="resetLayout">Reset layout</button>
      <button id="addFile" title="Files you open stay in your browser and are not saved with the layout. Models in app/public/models/ appear in each cell's model menu on your own machine and are never published.">Open .vrm file…</button>
      <input id="file" type="file" accept=".vrm" hidden />
    </header>
    <div id="layoutPop" role="dialog" aria-label="Grid size" hidden>
      <div class="pophead"><strong id="popSize">2 × 1</strong><span>columns × rows</span></div>
      <div id="picker"></div>
      <div class="popfoot">
        <input id="cols" type="number" min="1" max="4" value="2" aria-label="Columns" />
        <span>×</span>
        <input id="rows" type="number" min="1" max="4" value="1" aria-label="Rows" />
        <span class="hint">or click a square</span>
      </div>
    </div>
    <main id="grid"></main>
    <script type="module" src="/src/playground/main.ts"></script>
  </body>
</html>
